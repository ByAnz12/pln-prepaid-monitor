# Contoh dashboard PLN Prepaid Monitor
#
# JANGAN disalin mentah-mentah. entity_id di bawah ini mengikuti nama kelompok
# tagihan "PLN RUMAH" dan "PLN TOKO"; punya Anda kemungkinan berbeda.
#
# Cara mendapatkan versi yang sudah benar untuk instalasi Anda sendiri:
#   Developer Tools -> Actions -> "Buatkan dashboard" -> Perform action
# Hasilnya berupa YAML yang entity_id-nya sudah diisi otomatis.
#
# Cara memakainya:
#   Settings -> Dashboards -> + Add dashboard -> New dashboard from scratch
#   -> buka dashboard barunya -> pensil (kanan atas) -> titik tiga
#   -> Raw configuration editor -> tempelkan seluruh isi di bawah ini.
#
# Semua kartu di sini bawaan Home Assistant. Tidak perlu HACS.
#
# Berkas ini dibangkitkan oleh tests/test_dashboard_example.py - jangan diedit
# dengan tangan. Cara memperbaruinya ada di docstring test itu.

views:
- title: PLN RUMAH
  path: pln-rumah
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Ringkasan
      heading_style: title
    - type: conditional
      conditions:
      - entity: binary_sensor.pln_rumah_data_cukup_untuk_perkiraan
        state: 'on'
      card:
        type: gauge
        entity: sensor.pln_rumah_perkiraan_hari_tersisa
        name: Perkiraan hari tersisa
        min: 0
        max: 35
        severity:
          green: 7.0
          yellow: 3.0
          red: 0
    - type: gauge
      entity: sensor.pln_rumah_daya
      name: Daya yang dipakai saat ini
      needle: true
      min: 0
      max: 5000
    - type: glance
      title: 'Sumber energi: MCB RUMAH'
      entities:
      - entity: sensor.mcb_rumah_energi
        name: Meteran
      - entity: sensor.mcb_rumah_tegangan
        name: Tegangan
      - entity: sensor.mcb_rumah_arus
        name: Arus
      - entity: sensor.mcb_rumah_frekuensi
        name: Frekuensi
      - entity: binary_sensor.mcb_rumah_status_koneksi
        name: Koneksi
    - type: conditional
      conditions:
      - entity: binary_sensor.pln_rumah_penahanan_catatan_token
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: '### Pencatatan token ditahan


            Meteran ter-reset dan angka sesudahnya cukup besar, jadi sisa token dibekukan
            supaya tidak hangus salah. Pilih salah satu di bawah, atau buka **Developer
            Tools -> Actions -> Putuskan penahanan token** untuk memasukkan angka
            dari layar meteran.'
        - type: entities
          entities:
          - binary_sensor.pln_rumah_penahanan_catatan_token
        - type: horizontal-stack
          cards:
          - type: button
            name: Abaikan (meteran diganti)
            icon: mdi:close
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_ledger_hold
              data:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
                action: ignore
              confirmation:
                text: Abaikan (meteran diganti)?
          - type: button
            name: Anggap pemakaian nyata
            icon: mdi:check
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_ledger_hold
              data:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
                action: accept
              confirmation:
                text: Anggap pemakaian nyata?
    - type: entities
      title: Token
      entities:
      - entity: sensor.pln_rumah_sisa_token
        name: Sisa token
      - entity: sensor.pln_rumah_nilai_sisa_token
        name: Nilai sisa token
      - entity: sensor.pln_rumah_token_terpakai
        name: Terpakai dari token
      - entity: sensor.pln_rumah_rata_rata_pemakaian_harian
        name: Rata-rata harian
    - type: entities
      title: Status
      entities:
      - entity: sensor.pln_rumah_status_token
        name: Status
      - entity: sensor.pln_rumah_perkiraan_hari_tersisa
        name: Perkiraan hari tersisa
      - entity: sensor.pln_rumah_perkiraan_tanggal_habis
        name: Perkiraan tanggal habis
      - entity: binary_sensor.pln_rumah_data_cukup_untuk_perkiraan
        name: Data cukup untuk perkiraan
    - type: conditional
      conditions:
      - entity: binary_sensor.pln_rumah_data_cukup_untuk_perkiraan
        state: 'off'
      card:
        type: markdown
        content: '**Perkiraan belum bisa dihitung.** Sistem butuh beberapa hari data
          pemakaian dulu sebelum bisa menebak kapan token habis, jadi status dan tanggal
          habis masih kosong. Ini normal untuk pemasangan baru - tidak ada yang rusak,
          dan sisa token di bawah tetap dihitung benar.'
  - type: grid
    cards:
    - type: heading
      heading: Token
      heading_style: title
    - type: markdown
      content: '### Riwayat pengisian

        {% set log = state_attr(''sensor.pln_rumah_sisa_token'', ''topup_log'') or
        [] %}

        {% set rows = log[:(states(''number.pln_rumah'') | int(10))] %}

        {% if rows %}

        | # | Tanggal | kWh | Rupiah | Per kWh |

        |--:|---|--:|--:|--:|

        {%- for row in rows %}

        | {{ row.no }} | {{ (row.at | as_datetime | as_local).strftime(''%d/%m/%y
        %H:%M'') }} | {{ ''%.2f'' | format(row.kwh) }}{{ '' *'' if row.superseded
        else '''' }} | {{ (''Rp '' ~ ''{:,.0f}''.format(row.rp) | replace('','', ''.''))
        if row.rp else ''-'' }} | {{ (''Rp '' ~ ''{:,.2f}''.format(row.rate) | replace('','',
        ''@'') | replace(''.'', '','') | replace(''@'', ''.'')) if row.rate else ''-''
        }} |

        {%- endfor %}


        {% if log | selectattr(''superseded'') | list | count > 0 -%}

        Tanda bintang berarti pengisian itu sudah digantikan penyamaan atau reset,
        jadi tidak lagi ikut dihitung.

        {%- endif %}

        {% else %}

        Belum ada pengisian yang tercatat.

        {% endif %}'
    - type: entities
      entities:
      - entity: number.pln_rumah
        name: Tampilkan berapa baris
    - type: entities
      title: Isi token
      entities:
      - entity: select.pln_rumah_template_pengisian
        name: Pilih template
      - entity: number.pln_rumah_jumlah_kwh_pengisian
        name: Jumlah kWh
      - entity: number.pln_rumah_nominal_pembelian
        name: Nominal pembelian
      - entity: button.pln_rumah_catat_pengisian
        name: Catat pengisian
    - type: entities
      title: Template pengisian
      entities:
      - entity: text.pln_rumah_nama_template
        name: Nama template baru
      - entity: button.pln_rumah_simpan_sebagai_template
        name: Simpan sebagai template
      - entity: button.pln_rumah_perbarui_template_terpilih
        name: Perbarui template terpilih
      - entity: button.pln_rumah_hapus_template_terpilih
        name: Hapus template terpilih
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Beli besar
        show_icon: false
        show_state: false
        tap_action:
          action: perform-action
          perform_action: pln_prepaid_monitor.add_token_topup
          data:
            device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
            kwh_credited: 825.0
            nominal_rp: 1002500.0
          confirmation:
            text: Beli besar - Rp 1.002.500 (825,00 kWh)?
      - type: button
        name: Beli kecil
        show_icon: false
        show_state: false
        tap_action:
          action: perform-action
          perform_action: pln_prepaid_monitor.add_token_topup
          data:
            device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
            kwh_credited: 425.0
            nominal_rp: 503000.0
          confirmation:
            text: Beli kecil - Rp 503.000 (425,00 kWh)?
    - type: conditional
      conditions:
      - entity: binary_sensor.pln_rumah_usulan_harga_menunggu_keputusan
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: '{% set a = state_attr(''binary_sensor.pln_rumah_usulan_harga_menunggu_keputusan'',
            ''from_rate'') %}{% set b = state_attr(''binary_sensor.pln_rumah_usulan_harga_menunggu_keputusan'',
            ''to_rate'') %}{% set kwh = state_attr(''binary_sensor.pln_rumah_usulan_harga_menunggu_keputusan'',
            ''kwh'') %}{% set rp = state_attr(''binary_sensor.pln_rumah_usulan_harga_menunggu_keputusan'',
            ''nominal_rp'') %}{% if a is not none and b is not none %}### Harga per
            kWh berubah


            Pengisian terakhir menyebut jumlah kWh dan nominal sekaligus, jadi harga
            efektifnya bisa dihitung - sudah termasuk admin, PPJ, dan materai. Mau
            dipakai sebagai harga baru?


            | | |

            |---|--:|

            | Harga sekarang | Rp {{ ''{:,.2f}''.format(a) | replace('','', ''@'')
            | replace(''.'', '','') | replace(''@'', ''.'') }} |

            | Harga hasil hitungan | **Rp {{ ''{:,.2f}''.format(b) | replace('','',
            ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}** |

            | Dari pembelian | {{ ''%.2f'' | format(kwh | float(0)) }} kWh / Rp {{
            ''{:,.0f}''.format(rp | float(0)) | replace('','', ''.'') }} |


            {% if state_attr(''binary_sensor.pln_rumah_usulan_harga_menunggu_keputusan'',
            ''implausible'') %}> **Perubahannya besar sekali.** Periksa lagi angka
            pengisiannya sebelum menerima - salah ketik satu angka bisa membuat seluruh
            hitungan biaya berikutnya meleset.{% endif %}{% endif %}'
        - type: horizontal-stack
          cards:
          - type: button
            name: Ya, pakai harga baru
            icon: mdi:check
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_rate_change
              data:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
                apply: true
              confirmation:
                text: Ya, pakai harga baru?
          - type: button
            name: Tidak, biarkan
            icon: mdi:close
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_rate_change
              data:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
                apply: false
              confirmation:
                text: Tidak, biarkan?
    - type: markdown
      content: Dipakai kalau angka sistem sudah melenceng dari layar meteran. Isi
        angka yang tertera di meteran, lalu tekan **Samakan**.
    - type: entities
      title: Perbaiki hitungan
      entities:
      - entity: number.pln_rumah_sisa_token_di_layar_meteran
        name: Angka di layar meteran
      - entity: button.pln_rumah_samakan_dengan_angka_meteran
        name: Samakan
    - type: markdown
      content: Mulai pencatatan token dari nol. Seluruh pengisian yang masih aktif
        dianggap sudah tidak berlaku. **Tidak bisa dibatalkan.**
    - type: button
      name: Reset ke nol
      show_icon: false
      show_state: false
      tap_action:
        action: perform-action
        perform_action: pln_prepaid_monitor.reset_token_ledger
        data:
          device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
        confirmation:
          text: Reset ke nol?
  - type: grid
    cards:
    - type: heading
      heading: Pemakaian & biaya
      heading_style: title
    - type: markdown
      content: '### Pemakaian dan biaya

        {% set e = state_attr(''sensor.pln_rumah_total_energi'', ''period_summary'')
        or {} %}

        {% set c = state_attr(''sensor.pln_rumah_total_biaya'', ''period_summary'')
        or {} %}

        | | kWh | Rp |

        |---|--:|--:|

        | Rata-rata per jam | {% if e.get(''avg_hourly'') is not none %}{{ ''{:,.2f}''.format(e.get(''avg_hourly''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''avg_hourly'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''avg_hourly''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | Rata-rata harian | {% if e.get(''avg_daily'') is not none %}{{ ''{:,.2f}''.format(e.get(''avg_daily''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''avg_daily'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''avg_daily''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | Rata-rata bulanan | {% if e.get(''avg_monthly'') is not none %}{{ ''{:,.2f}''.format(e.get(''avg_monthly''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''avg_monthly'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''avg_monthly''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | Hari ini | {% if e.get(''this_day'') is not none %}{{ ''{:,.2f}''.format(e.get(''this_day''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''this_day'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''this_day''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | Hari kemarin | {% if e.get(''prev_day_1'') is not none %}{{ ''{:,.2f}''.format(e.get(''prev_day_1''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''prev_day_1'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''prev_day_1''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | 2 hari lalu | {% if e.get(''prev_day_2'') is not none %}{{ ''{:,.2f}''.format(e.get(''prev_day_2''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''prev_day_2'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''prev_day_2''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | 3 hari lalu | {% if e.get(''prev_day_3'') is not none %}{{ ''{:,.2f}''.format(e.get(''prev_day_3''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''prev_day_3'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''prev_day_3''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | Bulan ini | {% if e.get(''this_month'') is not none %}{{ ''{:,.2f}''.format(e.get(''this_month''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''this_month'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''this_month''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | Bulan kemarin | {% if e.get(''prev_month_1'') is not none %}{{ ''{:,.2f}''.format(e.get(''prev_month_1''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''prev_month_1'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''prev_month_1''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | 2 bulan lalu | {% if e.get(''prev_month_2'') is not none %}{{ ''{:,.2f}''.format(e.get(''prev_month_2''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''prev_month_2'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''prev_month_2''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |

        | 3 bulan lalu | {% if e.get(''prev_month_3'') is not none %}{{ ''{:,.2f}''.format(e.get(''prev_month_3''))
        | replace('','', ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}{%
        else %}-{% endif %} | {% if c.get(''prev_month_3'') is not none %}Rp {{ ''{:,.0f}''.format(c.get(''prev_month_3''))
        | replace('','', ''.'') }}{% else %}-{% endif %} |'
  - type: grid
    cards:
    - type: heading
      heading: Grafik
      heading_style: title
    - type: statistics-graph
      title: Pemakaian harian
      entities:
      - sensor.pln_rumah_total_energi
      stat_types:
      - change
      period: day
      days_to_show: 30
      chart_type: bar
    - type: statistics-graph
      title: Biaya harian
      entities:
      - sensor.pln_rumah_total_biaya
      stat_types:
      - change
      period: day
      days_to_show: 30
      chart_type: bar
  - type: grid
    cards:
    - type: heading
      heading: Analisa
      heading_style: title
    - type: history-graph
      title: Daya 24 jam terakhir
      hours_to_show: 24
      entities:
      - entity: sensor.pln_rumah_daya
        name: Sekarang
    - type: statistics-graph
      title: Pemakaian per jam (2 hari)
      entities:
      - sensor.pln_rumah_total_energi
      stat_types:
      - change
      period: hour
      days_to_show: 2
      chart_type: bar
    - type: statistics-graph
      title: Pemakaian per bulan (1 tahun)
      entities:
      - sensor.pln_rumah_total_energi
      stat_types:
      - change
      period: month
      days_to_show: 365
      chart_type: bar
    - type: statistics-graph
      title: Biaya per bulan (1 tahun)
      entities:
      - sensor.pln_rumah_total_biaya
      stat_types:
      - change
      period: month
      days_to_show: 365
      chart_type: bar
  - type: grid
    cards:
    - type: heading
      heading: Pengaturan
      heading_style: title
    - type: entities
      title: Pengaturan
      entities:
      - entity: number.tarif_r_1_tarif_per_kwh
        name: Tarif per kWh
      - entity: number.pln_rumah_ambang_peringatan
        name: Ambang peringatan
      - entity: number.pln_rumah_ambang_kritis
        name: Ambang kritis
      - entity: number.pln_rumah_ambang_sangat_kritis
        name: Ambang sangat kritis
    - type: markdown
      content: Mengirim satu pesan percobaan lewat tujuan notifikasi yang Anda atur,
        memakai jalur yang sama persis dengan pesan token sungguhan. Jam tenang dan
        jeda antar pesan dilewati.
    - type: entities
      entities:
      - entity: button.pln_rumah_uji_notifikasi
        name: Kirim pesan percobaan
    - type: markdown
      content: '### Perawatan


        Menghapus riwayat lama milik integrasi ini sesuai batas retensi yang Anda
        atur di **Configure**. Bersifat **permanen**. Entity dan data lain di Home
        Assistant Anda tidak tersentuh.'
    - type: button
      name: Bersihkan data
      show_icon: false
      icon: mdi:database-remove
      show_state: false
      tap_action:
        action: perform-action
        perform_action: pln_prepaid_monitor.purge_old_data
        data:
          device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
        confirmation:
          text: Bersihkan data?
- title: PLN TOKO
  path: pln-toko

            icon: mdi:check
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_ledger_hold
              target:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
              data:
                action: accept
              confirmation:
                text: Anggap pemakaian nyata?

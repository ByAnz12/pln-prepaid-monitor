    - type: conditional
      conditions:
      - entity: binary_sensor.pln_toko_usulan_harga_menunggu_keputusan
        state: 'on'
      card:
        type: vertical-stack
        cards:
        - type: markdown
          content: '{% set a = state_attr(''binary_sensor.pln_toko_usulan_harga_menunggu_keputusan'',
            ''from_rate'') %}{% set b = state_attr(''binary_sensor.pln_toko_usulan_harga_menunggu_keputusan'',
            ''to_rate'') %}{% set kwh = state_attr(''binary_sensor.pln_toko_usulan_harga_menunggu_keputusan'',
            ''kwh'') %}{% set rp = state_attr(''binary_sensor.pln_toko_usulan_harga_menunggu_keputusan'',
            ''nominal_rp'') %}{% if a is not none and b is not none %}### Harga per
            kWh berubah


            Pengisian terakhir menyebut jumlah kWh dan nominal sekaligus, jadi harga
            efektifnya bisa dihitung - sudah termasuk admin, PPJ, dan materai. Mau
            dipakai sebagai harga baru?


            | | |

            |---|--:|

            | Harga sekarang | Rp {{ ''{:,.2f}''.format(a) | replace('','', ''@'')
            | replace(''.'', '','') | replace(''@'', ''.'') }} |

            | Harga hasil hitungan | **Rp {{ ''{:,.2f}''.format(b) | replace('','',
            ''@'') | replace(''.'', '','') | replace(''@'', ''.'') }}** |

            | Dari pembelian | {{ ''%.2f'' | format(kwh | float(0)) }} kWh / Rp {{
            ''{:,.0f}''.format(rp | float(0)) | replace('','', ''.'') }} |


            {% if state_attr(''binary_sensor.pln_toko_usulan_harga_menunggu_keputusan'',
            ''implausible'') %}> **Perubahannya besar sekali.** Periksa lagi angka
            pengisiannya sebelum menerima - salah ketik satu angka bisa membuat seluruh
            hitungan biaya berikutnya meleset.{% endif %}{% endif %}'
        - type: horizontal-stack
          cards:
          - type: button
            name: Ya, pakai harga baru
            icon: mdi:check
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_rate_change
              data:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
                apply: true
              confirmation:
                text: Ya, pakai harga baru?
          - type: button
            name: Tidak, biarkan
            icon: mdi:close
            show_state: false
            tap_action:
              action: perform-action
              perform_action: pln_prepaid_monitor.resolve_rate_change
              data:
                device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
                apply: false
              confirmation:
                text: Tidak, biarkan?
    - type: markdown
      content: Dipakai kalau angka sistem sudah melenceng dari layar meteran. Isi

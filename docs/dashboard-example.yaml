  - type: grid
    cards:
    - type: heading
      heading: Token
      heading_style: title
    - type: markdown
      content: '### Riwayat pengisian

        {% set log = state_attr(''sensor.pln_toko_sisa_token'', ''topup_log'') or
        [] %}

        {% set rows = log[:(states(''number.pln_toko'') | int(10))] %}

        {% if rows %}

        | # | Tanggal | kWh | Rupiah | Per kWh |

        |--:|---|--:|--:|--:|

        {%- for row in rows %}

        | {{ row.no }} | {{ (row.at | as_datetime | as_local).strftime(''%d/%m/%y
        %H:%M'') }} | {{ ''%.2f'' | format(row.kwh) }}{{ '' *'' if row.superseded
        else '''' }} | {{ (''Rp '' ~ ''{:,.0f}''.format(row.rp) | replace('','', ''.''))
        if row.rp else ''-'' }} | {{ (''Rp '' ~ ''{:,.2f}''.format(row.rate) | replace('','',
        ''@'') | replace(''.'', '','') | replace(''@'', ''.'')) if row.rate else ''-''
        }} |

        {%- endfor %}


        {% if log | selectattr(''superseded'') | list | count > 0 -%}

        Tanda bintang berarti pengisian itu sudah digantikan penyamaan atau reset,
        jadi tidak lagi ikut dihitung.

        {%- endif %}

        {% else %}

        Belum ada pengisian yang tercatat.

        {% endif %}'
    - type: entities
      entities:
      - entity: number.pln_toko
        name: Tampilkan berapa baris
    - type: entities
      title: Isi token
      entities:

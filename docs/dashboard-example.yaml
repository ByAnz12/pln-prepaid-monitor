# Contoh dashboard PLN Prepaid Monitor
#
# JANGAN disalin mentah-mentah. entity_id di bawah ini mengikuti nama kelompok
# tagihan "PLN RUMAH" dan "PLN TOKO"; punya Anda kemungkinan berbeda.
#
# Cara mendapatkan versi yang sudah benar untuk instalasi Anda sendiri:
#   Developer Tools -> Actions -> "Buatkan dashboard" -> Perform action
# Hasilnya berupa YAML yang entity_id-nya sudah diisi otomatis.
#
# Cara memakainya:
#   Settings -> Dashboards -> + Add dashboard -> New dashboard from scratch
#   -> buka dashboard barunya -> pensil (kanan atas) -> titik tiga
#   -> Raw configuration editor -> tempelkan seluruh isi di bawah ini.
#
# Semua kartu di sini bawaan Home Assistant. Tidak perlu HACS.

views:
- title: PLN RUMAH
  path: pln-rumah
  cards:
  - type: entities
    title: Status
    entities:
    - entity: sensor.pln_rumah_status_token
      name: Status
    - entity: sensor.pln_rumah_perkiraan_hari_tersisa
      name: Perkiraan hari tersisa
    - entity: sensor.pln_rumah_perkiraan_tanggal_habis
      name: Perkiraan tanggal habis
    - entity: binary_sensor.pln_rumah_data_cukup_untuk_perkiraan
      name: Data cukup untuk perkiraan
  - type: conditional
    conditions:
    - entity: binary_sensor.pln_rumah_data_cukup_untuk_perkiraan
      state: 'off'
    card:
      type: markdown
      content: '**Perkiraan belum bisa dihitung.** Sistem butuh beberapa hari data
        pemakaian dulu sebelum bisa menebak kapan token habis, jadi status dan tanggal
        habis masih kosong. Ini normal untuk pemasangan baru - tidak ada yang rusak,
        dan sisa token di bawah tetap dihitung benar.'
  - type: gauge
    entity: sensor.pln_rumah_daya
    name: Arus
    needle: true
    min: 0
    max: 5000
  - type: glance
    title: 'Sumber energi: MCB RUMAH'
    entities:
    - entity: sensor.mcb_rumah_energi
      name: Angka meteran
    - entity: sensor.mcb_rumah_tegangan
      name: Tegangan
    - entity: sensor.mcb_rumah_arus
      name: Arus
    - entity: sensor.mcb_rumah_frekuensi
      name: Frekuensi
    - entity: binary_sensor.mcb_rumah_status_koneksi
      name: Koneksi
  - type: entities
    title: Arus
    entities:
    - entity: sensor.pln_rumah_energi_jam_ini
      name: Jam ini
    - entity: sensor.pln_rumah_energi_hari_ini
      name: Hari ini
    - entity: sensor.pln_rumah_energi_minggu_ini
      name: Minggu ini
    - entity: sensor.pln_rumah_energi_bulan_ini
      name: Bulan ini
    - entity: sensor.pln_rumah_energi_tahun_ini
      name: Tahun ini
  - type: entities
    title: Biaya
    entities:
    - entity: sensor.pln_rumah_biaya_jam_ini
      name: Jam ini
    - entity: sensor.pln_rumah_biaya_hari_ini
      name: Hari ini
    - entity: sensor.pln_rumah_biaya_minggu_ini
      name: Minggu ini
    - entity: sensor.pln_rumah_biaya_bulan_ini
      name: Bulan ini
    - entity: sensor.pln_rumah_biaya_tahun_ini
      name: Tahun ini
  - type: entities
    title: Token
    entities:
    - entity: sensor.pln_rumah_sisa_token
      name: Sisa token
    - entity: sensor.pln_rumah_nilai_sisa_token
      name: Nilai sisa token
    - entity: sensor.pln_rumah_token_terpakai
      name: Terpakai dari token
    - entity: sensor.pln_rumah_rata_rata_pemakaian_harian
      name: Rata-rata harian
  - type: conditional
    conditions:
    - entity: binary_sensor.pln_rumah_penahanan_catatan_token
      state: 'on'
    card:
      type: vertical-stack
      cards:
      - type: markdown
        content: '### Pencatatan token ditahan


          Meteran ter-reset dan angka sesudahnya cukup besar, jadi sisa token dibekukan
          supaya tidak hangus salah. Pilih salah satu di bawah, atau buka **Developer
          Tools -> Actions -> Putuskan penahanan token** untuk memasukkan angka dari
          layar meteran.'
      - type: entities
        entities:
        - binary_sensor.pln_rumah_penahanan_catatan_token
      - type: horizontal-stack
        cards:
        - type: button
          name: Abaikan (meteran diganti)
          icon: mdi:close
          show_state: false
          tap_action:
            action: perform-action
            perform_action: pln_prepaid_monitor.resolve_ledger_hold
            target:
              device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
            data:
              action: ignore
            confirmation:
              text: Abaikan (meteran diganti)?
        - type: button
          name: Anggap pemakaian nyata
          icon: mdi:check
          show_state: false
          tap_action:
            action: perform-action
            perform_action: pln_prepaid_monitor.resolve_ledger_hold
            target:
              device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
            data:
              action: accept
            confirmation:
              text: Anggap pemakaian nyata?
  - type: vertical-stack
    cards:
    - type: entities
      title: Isi token
      entities:
      - entity: number.pln_rumah_jumlah_kwh_pengisian
        name: Jumlah kWh
      - entity: button.pln_rumah_catat_pengisian
        name: Catat pengisian
    - type: markdown
      content: '**Nilai siap pakai**'
    - type: grid
      columns: 2
      square: false
      cards:
      - type: button
        name: Rp 1.000.000 (826,50 kWh)
        icon: mdi:cash-plus
        show_state: false
        tap_action:
          action: perform-action
          perform_action: pln_prepaid_monitor.add_token_topup
          target:
            device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
          data:
            kwh_credited: 826.5
            nominal_rp: 1000000.0
          confirmation:
            text: Rp 1.000.000 (826,50 kWh)?
      - type: button
        name: Rp 500.000 (413,25 kWh)
        icon: mdi:cash-plus
        show_state: false
        tap_action:
          action: perform-action
          perform_action: pln_prepaid_monitor.add_token_topup
          target:
            device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
          data:
            kwh_credited: 413.25
            nominal_rp: 500000.0
          confirmation:
            text: Rp 500.000 (413,25 kWh)?
  - type: vertical-stack
    cards:
    - type: markdown
      content: Dipakai kalau angka sistem sudah melenceng dari layar meteran. Isi
        angka yang tertera di meteran, lalu tekan **Samakan**.
    - type: entities
      title: Perbaiki hitungan
      entities:
      - entity: number.pln_rumah_sisa_token_di_layar_meteran
        name: Angka di layar meteran
      - entity: button.pln_rumah_samakan_dengan_angka_meteran
        name: Samakan
    - type: markdown
      content: Mulai pencatatan token dari nol. Seluruh pengisian yang masih aktif
        dianggap sudah tidak berlaku. **Tidak bisa dibatalkan.**
    - type: button
      name: Reset sisa token ke nol
      show_icon: false
      show_state: false
      tap_action:
        action: perform-action
        perform_action: pln_prepaid_monitor.reset_token_ledger
        target:
          device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
        confirmation:
          text: Reset sisa token ke nol?
  - type: entities
    title: Pengaturan
    entities:
    - entity: number.tarif_r_1_tarif_per_kwh
      name: Tarif per kWh
    - entity: number.pln_rumah_ambang_peringatan
    - entity: number.pln_rumah_ambang_kritis
    - entity: number.pln_rumah_ambang_sangat_kritis
  - type: statistics-graph
    title: Pemakaian harian
    entities:
    - sensor.pln_rumah_total_energi
    stat_types:
    - change
    period: day
    days_to_show: 30
    chart_type: bar
  - type: statistics-graph
    title: Biaya harian
    entities:
    - sensor.pln_rumah_total_biaya
    stat_types:
    - change
    period: day
    days_to_show: 30
    chart_type: bar
  - type: vertical-stack
    cards:
    - type: markdown
      content: '### Perawatan


        Menghapus riwayat lama milik integrasi ini sesuai batas retensi yang Anda
        atur di **Configure**. Bersifat **permanen**. Entity dan data lain di Home
        Assistant Anda tidak tersentuh.'
    - type: button
      name: Bersihkan data lama
      show_icon: false
      icon: mdi:database-remove
      show_state: false
      tap_action:
        action: perform-action
        perform_action: pln_prepaid_monitor.purge_old_data
        target:
          device_id: ganti-dengan-id-perangkat-kelompok-tagihan-anda
        confirmation:
          text: Bersihkan data lama?

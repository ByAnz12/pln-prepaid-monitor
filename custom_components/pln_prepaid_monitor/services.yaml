reset_token_ledger:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    note:
      required: false
      selector:
        text:

resolve_ledger_hold:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    action:
      required: true
      selector:
        select:
          options:
            - accept
            - ignore
            - calibrate
          translation_key: hold_action
    actual_remaining_kwh:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    note:
      required: false
      selector:
        text:

resolve_rate_change:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    apply:
      required: true
      selector:
        boolean:


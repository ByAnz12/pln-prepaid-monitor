add_token_topup:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    kwh_credited:
      required: false
      example: 826.5
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    nominal_rp:
      required: false
      example: 50000
      selector:
        number:
          min: 0
          step: 100
          mode: box
    timestamp:
      required: false
      selector:
        datetime:
    meter_reading_before:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    meter_reading_after:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    note:
      required: false
      selector:
        text:

calibrate_token_reading:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    actual_remaining_kwh:

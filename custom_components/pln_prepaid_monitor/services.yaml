            model: Billing Group
    topup_id:
      required: true
      example: a1b2c3d4e5f6
      selector:
        text:
    kwh_credited:
      required: false
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
          unit_of_measurement: kWh
    nominal_rp:
      required: false
      selector:
        number:
          min: 0
          step: 100
          mode: box
    timestamp:
      required: false
      selector:
        datetime:
    note:
      required: false
      selector:
        text:

delete_topup:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    topup_id:
      required: true
      example: a1b2c3d4e5f6
      selector:

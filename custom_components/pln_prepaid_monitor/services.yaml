purge_old_data:
  fields:
    device_id:
      required: false
      selector:
        device:
          filter:
            integration: pln_prepaid_monitor
            model: Billing Group
    keep_years:
      required: false
      selector:
        select:
          options:
            - "1"
            - "2"
            - "3"
            - "5"
            - unlimited
          translation_key: statistics_retention_years
